<!DOCTYPE html>
<html>

<head>
    <title>Chem Draw</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #f0f0f0;
            padding: 2rem 0;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        #faltu {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem 3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            width: 80%;
            max-width: 1000px;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        #faltu h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 0;
            min-width: 180px;
        }

        #formula {
            padding: 0.8rem 1.2rem;
            font-size: 1.3rem;
            border-radius: 12px;
            border: none;
            outline: none;
            flex: 1;
            min-width: 250px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }

        #formula::placeholder {
            color: #ddd;
        }

        #formula:focus {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            transform: scale(1.03);
        }

        button {
            padding: 0.8rem 1.8rem;
            font-size: 1.2rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #00f5a0, #00d1ff);
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 255, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.5);
        }

        #result {
            width: 85%;
            max-width: 1200px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        #result:hover {
            transform: scale(1.02);
        }

        @media (max-width: 900px) {
            #faltu {
                flex-direction: column;
                width: 90%;
            }

            #formula {
                width: 100%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>Chem Draw</h1>

    <div id="faltu">
        <h2>Enter Molecule Formula</h2>
        <input type="text" id="formula" placeholder="e.g., C6H6"/>
        <button onclick="validate()">Generate</button>
    </div>
    
    <img src="/static/molecules_grid.png?v=0" id="result">
    <p id="warn" style="color:red; display:none;">
        Only C, H, N with valid numbers allowed
    </p>

    <script>
        function validate() {
            const s = document.getElementById("formula").value;
            const warn = document.getElementById("warn");

            const regex = /^((C|H|N)([1-9][0-9]*)?)+$/;
            warn.style.display = regex.test(s) ? "none" : "block";
            if (s !== "" && !regex.test(s)) {
                alert("Only C, H, N with valid numbers allowed (e.g. C6H6)");
            }
            else{
                backend()
            }
        }

        async function backend() {
            const formula = document.getElementById("formula").value;
            if (!formula) return alert("Enter a formula");

            await fetch("/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ formula })
            });

            const img = document.getElementById("result");
            img.src = "/static/molecules_grid.png?v=" + Date.now();
        }
    </script>
</body>

</html>
