<!DOCTYPE html>
<html>

<head>
    <title>Chem Draw</title>

    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <h1>Chem Draw</h1>

    <div id="navBar">
        <div id="navBrand">Chem Draw</div>
        <div id="navLinks">
            <a class="navLink active" href="/">Generator</a>
            <a class="navLink" href="/viewer">Viewer</a>
        </div>
    </div>

    <div id="Main">
        <input type="text" id="formula" placeholder="e.g., C6H6" />
        <button id="generateBtn" type="button">Generate</button>
        <button id="downloadBtn" type="button">Download</button>
        <div id="modeToggle">
            <label><input type="radio" name="mode" value="2d" checked> 2D</label>
            <label><input type="radio" name="mode" value="3d"> 3D</label>
        </div>
        <div id="statusBar" data-state="info"></div>
    </div>

    <div class="content">
        <div id="page2d" class="page"></div>

        <div id="page3d" class="page">
            <div id="viewer3d"></div>
            <div id="nav3d">
                <button id="prevBtn" type="button">◀ Previous</button>
                <span id="indexLabel"></span>
                <button id="nextBtn" type="button">Next ▶</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>

</body>

</html>
